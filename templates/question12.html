{% extends "layout.html" %}

{% block title %}
    Question 12
{% endblock %}

{% block main %}
    <div style="margin-top: 50px" class="user-select-none fade-in5s row justify-content-center">
        <div class="col-md-6">
            <div class="bg-light p-4 rounded shadow text-left">
                <h5 class="text-center mb-4">If a train is traveling at 90 km/h and the total distance is 270 km, how long will it take to reach its destination?</h5>

                <form action="/question12" method="POST">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="answer" id="option1" value="2 hours" required>
                        <label class="form-check-label" for="option1">2 hours</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="answer" id="option2" value="3.5 hours">
                        <label class="form-check-label" for="option2">3.5 hours</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="answer" id="option3" value="3 hours">
                        <label class="form-check-label" for="option3">3 hours</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="answer" id="option4" value="4 hours">
                        <label class="form-check-label" for="option4">4 hours</label>
                    </div>
                    <button style = "border-radius: 20px;margin-top: 30px" type="submit" class="btn btn-info">Next Question</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
