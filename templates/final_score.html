{% extends "layout.html" %}

{% block title %}
    Results
{% endblock %}

{% block main %}
    <!-- Loading Screen -->
    <div id="loading" style="text-align: center; margin-top: 50px;">
        <canvas id="canvas" width="300" height="300"></canvas>
        <p>Loading your results...</p>
    </div>

    <!-- Final Score Section (Initially hidden) -->
    <div id="result" style="display: none; text-align: center; margin-top: 160px;">
        <h2 style="font-size: 50px; font-weight: 20;">Your IQ is</h2>
        <h1 style="font-size: 60px; font-weight: 20; color: green;">{{ iq }}</h1> <!-- Display the IQ score -->
        <p style="font-size: 15px; font-weight: 20">
            You took {{ time_taken if time_taken is not none else "N/A" }} minutes.
        </p> <!-- Display the time taken -->
    </div>

    <!-- Add the Lottie animation here -->
    <script type="module">
        import { DotLottie } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web/+esm";

        new DotLottie({
            autoplay: true,
            loop: true,
            canvas: document.getElementById("canvas"),
            src: "https://lottie.host/bd62f50e-2b3e-43cc-8f87-1a81fe8ae12c/90FlpvVx4A.json"
        });
    </script>

    <!-- JavaScript to handle loading screen -->
    <script>
        // Show loading screen for 3 seconds then display results
        window.onload = function() {
            setTimeout(function() {
                document.getElementById("loading").style.display = "none"; // Hide loading screen
                document.getElementById("result").style.display = "block"; // Show result
            }, 10000); // 10 seconds delay
        };
    </script>
{% endblock %}
